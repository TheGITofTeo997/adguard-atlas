services:
  adguard-atlas:
    build: .
    container_name: adguard-atlas
    restart: unless-stopped
    env_file: .env
    volumes:
      - atlas-data:/data                       # persists 2FA configuration
    networks:                                  # this my reverse proxy network, you can expose port instead of this
      proxy-network:
        ipv4_address: 172.30.0.115
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    image: theaccountofteo997/adguard-atlas:latest

volumes:
  atlas-data:

networks:
  proxy-network:
    external: true