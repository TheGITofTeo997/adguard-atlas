<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · AdGuard Atlas</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <form id="login-form" autocomplete="on">
    <h1>AdGuard Atlas</h1>
    <div id="creds">
      <label>Username <input name="username" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    </div>
    <div id="code-row" hidden>
      <p class="hint">Enter the 6-digit code from your authenticator app, or a recovery code.</p>
      <label>Authentication code <input name="code" id="code" autocomplete="one-time-code" autocapitalize="off" spellcheck="false"></label>
    </div>
    <button type="submit">Sign in</button>
    <p id="error" role="alert"></p>
  </form>
  <script src="login.js"></script>
</body>
</html>
